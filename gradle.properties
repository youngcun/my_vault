org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# 强制 UTF-8：源码与测试报告里都有中文文案，若按平台默认编码（中文 Windows 是 GBK）
# 处理，会出现编译告警与测试报告乱码。
org.gradle.daemon.jvmargs=-Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8

android.useAndroidX=true
android.nonTransitiveRClass=true
# 显式关闭「默认启用 BuildConfig」的旧行为（app 模块内单独开启）
android.defaults.buildfeatures.buildconfig=false
# 本项目只使用 compileSdk 34（AGP 8.5.2 受支持的稳定 API 级别）
android.suppressUnsupportedCompileSdk=34

kotlin.code.style=official
ksp.incremental=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
